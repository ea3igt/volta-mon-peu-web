name: Actualitza dades i publica el web

on:
  push:
    branches: [main]
  schedule:
    # Candidats UTC per executar el reforç a les 00:27 i 12:27
    # d'Europa/Madrid tant a l'horari d'estiu com al d'hivern.
    - cron: "27 10 * * *"
    - cron: "27 11 * * *"
    - cron: "27 22 * * *"
    - cron: "27 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  valida_horari:
    name: Valida l'horari de reforç
    runs-on: ubuntu-latest
    outputs:
      executa: ${{ steps.hora.outputs.executa }}
    steps:
      - name: Comprova el fus horari de Catalunya
        id: hora
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "executa=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          programacio="${{ github.event.schedule }}"
          desplacament="$(TZ=Europe/Madrid date +'%z')"
          echo "Programació UTC: $programacio; desplaçament Europe/Madrid: $desplacament"

          case "$programacio:$desplacament" in
            "27 10 * * *:+0200"|"27 22 * * *:+0200"|\
            "27 11 * * *:+0100"|"27 23 * * *:+0100")
              echo "executa=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "executa=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  prepara:
    needs: valida_horari
    if: needs.valida_horari.outputs.executa == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Recupera el projecte
        uses: actions/checkout@v7

      - name: Prepara Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Recalcula les estadístiques dels GPX
        run: python scripts/update_data.py

      - name: Desa les dades noves al repositori
        run: |
          if git diff --quiet -- data/stats.json data/geocode-cache.json; then
            echo "No hi ha dades noves."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/stats.json data/geocode-cache.json
            git commit -m "Actualitza les dades del viatge"
            git push
          fi

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepara els fitxers del web
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  publica:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: prepara
    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

